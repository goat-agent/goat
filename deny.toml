[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained but rmcp, the official MCP SDK, depends on it and goat uses no time zone parsing through it" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained but complete; syntect only uses it to load its bundled syntaxes" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
