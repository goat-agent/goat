name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  COPYFILE_DISABLE: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: tag matches manifest
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "goat-code") | .version')
          version="$manifest"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$manifest" ]; then
              echo "tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
              exit 1
            fi
          fi
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --profile dist -p goat-code --bin goat --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/goat" dist/goat
          tar -C dist -czf "goat-${{ matrix.target }}.tar.gz" goat
          tar -tzf "goat-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: goat-${{ matrix.target }}
          path: goat-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        working-directory: artifacts
        run: |
          sha256sum goat-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes)
          if [ "${{ needs.verify.outputs.prerelease }}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* "${flags[@]}"

  smoke:
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: install from release
        run: |
          for attempt in 1 2 3; do
            if sh install.sh; then
              exit 0
            fi
            echo "install attempt $attempt failed, retrying" >&2
            sleep 15
          done
          exit 1
      - name: installed version matches tag
        run: |
          installed=$("$HOME/.goat/bin/goat" --version | awk '{print $NF}')
          expected="${{ needs.verify.outputs.version }}"
          if [ "$installed" != "$expected" ]; then
            echo "installed $installed, expected $expected" >&2
            exit 1
          fi
