name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all --check

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: build test binaries
        run: cargo nextest run --workspace --locked --no-run
      - name: tests library
        run: |
          cargo nextest run --workspace --locked --no-fail-fast \
            -E 'not (package(goat-daemon) | package(goat-mcp) | package(goat-agent-tool-pty) | package(goat-tool-shell) | package(goat-engine) | package(goat-worktree) | package(goat-remote))'
      - name: tests worktree
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'package(goat-worktree)'
      - name: tests remote
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'package(goat-remote)'
      - name: tests engine
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'package(goat-engine)'
      - name: tests shell
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'package(goat-tool-shell)'
      - name: tests pty
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'package(goat-agent-tool-pty)'
      - name: tests mcp
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'package(goat-mcp)'
      - name: tests daemon
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'package(goat-daemon)'
      - name: binary starts
        run: cargo run --locked -p goat-code --bin goat -- --version

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.95 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo check --workspace --locked
