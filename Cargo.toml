[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.27"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/goat-agent/goat"
authors = ["jmo", "jbj338033"]
publish = false

[workspace.dependencies]
goat-protocol = { path = "crates/goat-protocol" }
goat-core = { path = "crates/goat-core" }
goat-mcp = { path = "crates/goat-mcp" }
goat-tui = { path = "crates/goat-tui" }
goat-provider = { path = "crates/goat-provider" }
goat-auth = { path = "crates/goat-auth" }
goat-provider-openai-compat = { path = "crates/goat-provider-openai-compat" }
goat-provider-openrouter = { path = "crates/goat-provider-openrouter" }
goat-provider-groq = { path = "crates/goat-provider-groq" }
goat-provider-deepseek = { path = "crates/goat-provider-deepseek" }
goat-provider-mistral = { path = "crates/goat-provider-mistral" }
goat-provider-zai = { path = "crates/goat-provider-zai" }
goat-provider-zai-coding = { path = "crates/goat-provider-zai-coding" }
goat-provider-kimi = { path = "crates/goat-provider-kimi" }
goat-provider-qwen = { path = "crates/goat-provider-qwen" }
goat-provider-kimi-code = { path = "crates/goat-provider-kimi-code" }
goat-provider-xai = { path = "crates/goat-provider-xai" }
goat-provider-openai = { path = "crates/goat-provider-openai" }
goat-provider-openai-codex = { path = "crates/goat-provider-openai-codex" }
goat-provider-anthropic = { path = "crates/goat-provider-anthropic" }
goat-provider-gemini = { path = "crates/goat-provider-gemini" }
goat-provider-local = { path = "crates/goat-provider-local" }
goat-providers = { path = "crates/goat-providers" }
goat-search-provider = { path = "crates/goat-search-provider" }
goat-search-provider-duckduckgo = { path = "crates/goat-search-provider-duckduckgo" }
goat-search-provider-searxng = { path = "crates/goat-search-provider-searxng" }
goat-search-provider-brave = { path = "crates/goat-search-provider-brave" }
goat-search-provider-tavily = { path = "crates/goat-search-provider-tavily" }
goat-search-providers = { path = "crates/goat-search-providers" }
goat-engine = { path = "crates/goat-engine" }
goat-tool = { path = "crates/goat-tool" }
goat-sandbox = { path = "crates/goat-sandbox" }
goat-process = { path = "crates/goat-process" }
goat-tool-fs = { path = "crates/goat-tool-fs" }
goat-tool-web = { path = "crates/goat-tool-web" }
goat-tool-shell = { path = "crates/goat-tool-shell" }
goat-tool-search = { path = "crates/goat-tool-search" }
goat-tool-skill = { path = "crates/goat-tool-skill" }
goat-tools = { path = "crates/goat-tools" }
goat-tool-computer = { path = "crates/goat-tool-computer" }
goat-tool-browser = { path = "crates/goat-tool-browser" }
goat-skill = { path = "crates/goat-skill" }
goat-command = { path = "crates/goat-command" }
goat-command-settings = { path = "crates/goat-command-settings" }
goat-command-conversation = { path = "crates/goat-command-conversation" }
goat-command-help = { path = "crates/goat-command-help" }
goat-command-app = { path = "crates/goat-command-app" }
goat-commands = { path = "crates/goat-commands" }
goat-worktree = { path = "crates/goat-worktree" }
goat-github = { path = "crates/goat-github" }
goat-wire = { path = "crates/goat-wire" }
goat-daemon = { path = "crates/goat-daemon" }
goat-client = { path = "crates/goat-client" }
goat-remote = { path = "crates/goat-remote" }

tokio                   = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
bytes = "1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

ratatui = "0.30"
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
termbg = "0.6"

clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
console = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"
ignore = "0.4"
regex = "1"
tempfile = "3"
unicode-width = "0.2"
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.12", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
htmd = "0.5"
encoding_rs = "0.8"
dom_smoothie = "0.18"
pdf_oxide = "0.3"
eventsource-stream = "0.2"
sha2 = "0.11"
semver = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
percent-encoding = "2"
enigo = "0.6"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
chromiumoxide = "0.9"
arboard = "3.6.1"
rand = "0.10"
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process"] }
open = "5"
fs2 = "0.4"
rustix = { version = "1", features = ["process"] }
self_replace = { package = "self-replace", version = "1" }

tracing = "0.1"
tracing-subscriber      = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
color-eyre = "0.6"
thiserror = "2"

tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
tokio-tungstenite = "0.28"
qrcode = { version = "0.14", default-features = false }

goat-types              = { path = "crates/goat-types" }
goat-sqlite-vec         = { path = "crates/goat-sqlite-vec" }
goat-bus                = { path = "crates/goat-bus" }
goat-store              = { path = "crates/goat-store" }
goat-config             = { path = "crates/goat-config" }
goat-console            = { path = "crates/goat-console" }
goat-agent-command            = { path = "crates/goat-agent-command" }
goat-agent-command-skill      = { path = "crates/goat-agent-command-skill" }
goat-model              = { path = "crates/goat-model" }
goat-channel            = { path = "crates/goat-channel" }
goat-channel-telegram   = { path = "crates/goat-channel-telegram" }
goat-channel-discord    = { path = "crates/goat-channel-discord" }
goat-render             = { path = "crates/goat-render" }
goat-plugin             = { path = "crates/goat-plugin" }
goat-integration        = { path = "crates/goat-integration" }
goat-agent-tool               = { path = "crates/goat-agent-tool" }
goat-agent-tool-fs            = { path = "crates/goat-agent-tool-fs" }
goat-agent-tool-shell         = { path = "crates/goat-agent-tool-shell" }
goat-agent-tool-skill         = { path = "crates/goat-agent-tool-skill" }
goat-agent-tool-schedule      = { path = "crates/goat-agent-tool-schedule" }
goat-agent-tool-goal          = { path = "crates/goat-agent-tool-goal" }
goat-agent-tool-code          = { path = "crates/goat-agent-tool-code" }
goat-agent-tool-memory        = { path = "crates/goat-agent-tool-memory" }
goat-agent-tool-pty           = { path = "crates/goat-agent-tool-pty" }
goat-brain              = { path = "crates/goat-brain" }
goat-profile            = { path = "crates/goat-profile" }
goat-runtime            = { path = "crates/goat-runtime" }
goat-agent              = { path = "crates/goat-agent" }
goat-memory             = { path = "crates/goat-memory" }
goat-skills             = { path = "crates/goat-skills" }
goat-loop               = { path = "crates/goat-loop" }
goat-sleep              = { path = "crates/goat-sleep" }
goat-embedding              = { path = "crates/goat-embedding" }
tokio-stream            = { version = "0.1" }
pty-process             = { version = "0.5", features = ["async"] }
inventory               = "0.3"
anyhow                  = "1"
toml                    = "0.8"
sqlx                    = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono", "uuid", "json"] }
sqlite-vec              = "0.1"
libsqlite3-sys          = "0.37"
zerocopy                = "0.7"
tiny_http               = "0.12"
urlencoding             = "2"
chrono                  = { version = "0.4", features = ["serde"] }
cron                    = "0.15"
uuid                    = { version = "1", features = ["v4", "v5", "v7", "serde"] }
url                     = { version = "2", features = ["serde"] }
walkdir                 = "2"
globset                 = "0.4"
vt100                   = "0.15"
libc                    = "0.2"
teloxide                = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
twilight-gateway        = "0.16"
twilight-http           = "0.16"
twilight-model          = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
too_many_lines = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
