[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
goat-core = { path = "crates/goat-core" }
anyhow = "1"
arboard = { version = "3.7", features = ["wayland-data-control"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
getrandom = "0.4"
htmd = "0.6"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form"] }
rmcp = { version = "3.11", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rquickjs = { version = "0.14", default-features = false, features = ["std", "futures"] }
rusqlite = { version = "0.43", features = ["bundled", "uuid"] }
rustix = { version = "1", features = ["process", "event", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
similar = "3.2"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tempfile = "3"
thiserror = "2"
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "macros", "process", "io-util", "time", "fs", "net", "sync"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
expect_used = "warn"
unwrap_used = "warn"
get_unwrap = "warn"
mod_module_files = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
large_futures = "warn"
rc_buffer = "warn"
str_to_string = "warn"

[workspace.lints.cargo]
unused_dependencies = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
